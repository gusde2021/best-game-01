<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloomkeeper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1020; font-family: system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

</style>
</head>
<body>
<canvas id="game" aria-label="Bloomkeeper: guide the firefly guardian, blast gloom moths, collect pollen and unleash bloom burst"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
